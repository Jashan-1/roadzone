# Tricky-scenario probes for the Stevens Creek base (placeholder). Public places only, no customer data.
# Expectations are engineering judgement, not director-confirmed. Checks (all optional per case):
#   status / status_not: exact status or a status that must NOT occur
#   refs_any: acceptable normalized ref sets for the corridor; direction: N/E/S/W
#   differs_from: id of another case that must get a different corridor family (same-area, different highway)
#   farther_than_circle: road band must exceed the straight-line ("circle") band
#   detour_ratio_min: road miles / straight-line miles must be at least this (one-road mountain access)
#   snap_not_motorway: the snapped road must not be a motorway/ramp
#   not_extent_review: no extent_review_required reason
# Every case is also routed by OSRM (public demo server) as an independent cross-check.

